name: Build TKB APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Build validation: compile Rust JNI for every ABI before packaging TKB SV.
# GitHub Pages rejects a deployment while another deployment is in
# progress (HTTP 400). Serialize the ENTIRE build + deploy workflow so a new
# push cannot cancel an active deployment. GitHub retains the latest pending
# run rather than publishing a stale intermediate APK.
concurrency:
  group: tkb-pages-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify data safety, SQLite migrations and portal auth
        run: |
          python3 tests/test_data_safety.py
          python3 tests/test_auth_refresh.py

      - name: Install Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Locate Android NDK
        shell: bash
        run: |
          ndk=""
          if [[ -d "$ANDROID_HOME/ndk" ]]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          if [[ -z "$ndk" ]]; then
            sdkmanager --install "ndk;27.2.12479018"
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Test Rust and compile Android JNI libraries
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          bash scripts/build-rust-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Bump version
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Decode keystore
        run: base64 -d tkb-release.keystore.b64 > tkb-release.keystore

      - name: Test portal JSON and build signed APK
        run: |
          # Run real Kotlin serialization tests, not only source-code assertions.
          # The committed keystore is PKCS#12, so its private key uses the store password.
          gradle testDebugUnitTest assembleDebug \
            -Pandroid.injected.signing.store.file="$PWD/tkb-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=tkb \
            -Pandroid.injected.signing.key.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}"

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -Z -1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx "lib/$abi/libtkb_core.so"
          done

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TKB-SV.apk
          xz -9 -k TKB-SV.apk
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          version_code = 100000 + int(os.environ["GITHUB_RUN_NUMBER"])
          version_name = f"1.0.0.{os.environ['GITHUB_RUN_NUMBER']}"
          changelog = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"], text=True
          ).strip()
          commit = os.environ["GITHUB_SHA"]
          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          update = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": "https://ngocminhvn.github.io/tkb/TKB-SV.apk",
              "packageUrl": "https://ngocminhvn.github.io/tkb/TKB-SV.apk.xz",
              "compression": "xz",
              "sha256": sha256("TKB-SV.apk"),
              "packageSha256": sha256("TKB-SV.apk.xz"),
              "sizeBytes": os.path.getsize("TKB-SV.apk"),
              "packageSizeBytes": os.path.getsize("TKB-SV.apk.xz"),
              "changelog": changelog,
              "commit": commit,
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("update.json", "w") as f:
              json.dump(update, f, indent=2, ensure_ascii=False)
          print(json.dumps(update, indent=2, ensure_ascii=False))
          PY
          touch .nojekyll
          ls -lh TKB-SV.apk TKB-SV.apk.xz update.json

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TKB-SV-APK-${{ github.run_number }}
          path: TKB-SV.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Stage Pages files
        run: |
          mkdir -p pages
          cp TKB-SV.apk TKB-SV.apk.xz update.json .nojekyll pages/
          ls -lh pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
