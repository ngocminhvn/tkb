name: Build TKB APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Bump version
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Decode keystore
        run: base64 -d tkb-release.keystore.b64 > tkb-release.keystore

      - name: Build signed debug APK
        run: |
          # The committed keystore is PKCS#12, so its private key uses the store password.
          gradle assembleDebug \
            -Pandroid.injected.signing.store.file="$PWD/tkb-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=tkb \
            -Pandroid.injected.signing.key.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}"

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SvTNU.apk
          xz -9 -k SvTNU.apk
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          version_code = 100000 + int(os.environ["GITHUB_RUN_NUMBER"])
          version_name = f"1.0.0.{os.environ['GITHUB_RUN_NUMBER']}"
          changelog = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"], text=True
          ).strip()
          commit = os.environ["GITHUB_SHA"]
          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          update = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": "https://ngocminhvn.github.io/tkb/SvTNU.apk",
              "packageUrl": "https://ngocminhvn.github.io/tkb/SvTNU.apk.xz",
              "compression": "xz",
              "sha256": sha256("SvTNU.apk"),
              "packageSha256": sha256("SvTNU.apk.xz"),
              "sizeBytes": os.path.getsize("SvTNU.apk"),
              "packageSizeBytes": os.path.getsize("SvTNU.apk.xz"),
              "changelog": changelog,
              "commit": commit,
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          with open("update.json", "w") as f:
              json.dump(update, f, indent=2, ensure_ascii=False)
          print(json.dumps(update, indent=2, ensure_ascii=False))
          PY
          touch .nojekyll
          ls -lh SvTNU.apk SvTNU.apk.xz update.json

      - name: Stage Pages files
        run: |
          mkdir -p pages
          cp SvTNU.apk SvTNU.apk.xz update.json .nojekyll pages/
          ls -lh pages/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
