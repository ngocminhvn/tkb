name: Build TKB APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Build validation: compile Rust JNI for every ABI before packaging TKB SV.
concurrency:
  group: tkb-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: clippy

      - name: Test Rust core and SQLite compatibility
        run: |
          cargo test --locked --manifest-path rust-core/Cargo.toml
          cargo clippy --locked --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Locate Android NDK
        shell: bash
        run: |
          # Respect the NDK already selected by the runner; cargo-ndk
          # must not see conflicting ANDROID_NDK_{HOME,ROOT} values.
          ndk="${ANDROID_NDK_ROOT:-}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="${ANDROID_NDK_HOME:-}"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            sdkmanager --install "ndk;27.2.12479018"
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

      - name: Compile Android JNI libraries
        run: bash scripts/build-rust-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Verify Kotlin database adapter against native JNI
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip -o "$RUNNER_TEMP/kotlin.zip"
          echo "b6698d5728ad8f9edcdd01617d638073191d8a03139cc538a391b4e3759ad297  $RUNNER_TEMP/kotlin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin-native-test"
          cargo build --locked --manifest-path rust-core/Cargo.toml
          KOTLIN_HOME="$RUNNER_TEMP/kotlin-native-test/kotlinc" python3 tests/native_database_smoke.py

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Bump version
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Decode keystore
        run: base64 -d tkb-release.keystore.b64 > tkb-release.keystore

      - name: Build signed R8 Release APK
        run: |
          # The committed keystore is PKCS#12, so its private key uses the store password.
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/tkb-release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=tkb \
            -Pandroid.injected.signing.key.password="${{ secrets.TKB_KEYSTORE_PASSWORD }}"

      - name: Verify Release APK, signing certificate and Rust JNI
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s app/build/outputs/mapping/release/mapping.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q '^application-debuggable$'
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -Z -1 "$apk" | grep -Fx "lib/$abi/libtkb_core.so"
          done
          # Check the signature against the keystore used by previous builds.
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          expected="$(keytool -list -v -keystore tkb-release.keystore -alias tkb \
            -storepass "${{ secrets.TKB_KEYSTORE_PASSWORD }}" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':')"
          test -n "$actual"
          test -n "$expected"
          test "${actual,,}" = "${expected,,}"
          # Fail before publishing if the existing downloadable APK has a
          # different signature. A missing old download only emits a warning.
          if curl -fsSL --connect-timeout 10 --max-time 45 \
            https://ngocminhvn.github.io/tkb/TKB-SV.apk -o previous-TKB-SV.apk; then
            previous="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs previous-TKB-SV.apk |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
            test -n "$previous"
            test "${actual,,}" = "${previous,,}" || {
              echo "::error::Signing certificate differs from the current published APK."
              exit 1
            }
            rm -f previous-TKB-SV.apk
          else
            echo "::warning::Previous APK unavailable; checked certificate against existing keystore."
          fi

      - name: Copy APK to release name
        run: cp app/build/outputs/apk/release/app-release.apk TKB-SV.apk

      - name: Upload TKB-SV.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TKB-SV.apk
          path: TKB-SV.apk
