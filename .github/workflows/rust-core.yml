name: Rust Core Tests

on:
  push:
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
