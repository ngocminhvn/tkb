[package]
name = "tkb-core"
version = "0.2.0"
edition = "2021"
description = "Android native schedule business logic for TKB SV"
license = "MIT"

[lib]
name = "tkb_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
jni = "0.21.1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
sha2 = "0.11"
rusqlite = { version = "0.38", features = ["bundled"] }
miniz_oxide = "0.9.1"
lopdf = { version = "0.42", default-features = false }
adobe-cmap-parser = "0.4.1"
type1-encoding-parser = "0.1.1"
encoding_rs = "0.8.44"
euclid = "0.20.14"
unicode-normalization = "0.1.26"
log = "0.4"
pom = "1.1.0"
cff-parser = "0.2.0"
ttf-parser = "0.25.1"
postscript = "0.14.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
