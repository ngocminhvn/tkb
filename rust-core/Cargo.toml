[package]
name = "tkb-core"
version = "0.2.0"
edition = "2021"
description = "Android native schedule business logic for TKB SV"
license = "MIT"

[lib]
name = "tkb_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
